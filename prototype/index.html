<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>포켓몬카드 · 번개장터 취향 커뮤니티</title>
  <link rel="stylesheet" href="design-tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="preview-label"><span class="brand"><img src="assets/lightning.svg" alt="">번개장터</span><span>커뮤니티 프로토타입</span></aside>
  <main class="app" data-component="Page">
    <header class="navigation" data-component="NavigationBar">
      <h1>취향 커뮤니티</h1>
      <div class="nav-actions">
        <button class="icon-button" data-action="about" aria-label="커뮤니티 안내"><img src="assets/info.svg" alt=""></button>
        <button class="icon-button activity-button" data-action="activity" aria-label="내 반응 소식"><img src="assets/talk.svg" alt=""><span class="notification-dot"></span></button>
      </div>
    </header>
    <div data-component="SectionGroup">
      <section class="theme-section" data-component="Section">
        <div class="theme-intro" data-domain="ThemeIdentity">
          <div><span class="eyebrow">우리의 취향</span><h2>포켓몬카드</h2><p>카드 한 장에 진심인 사람들</p></div>
          <div class="card-fan" aria-hidden="true"><img src="assets/squirtle.png" alt=""><img src="assets/pikachu.jpg" alt=""></div>
        </div>
        <button class="connection" data-action="connection"><img src="assets/lightning.svg" alt=""><span id="connection-text"><strong>3번의 거래로 연결된 포켓몬카드 취향</strong><small>내 거래에서 함께 볼 카드를 골라보세요.</small></span><img src="assets/right.svg" alt=""></button>
      </section>
      <section class="tab-content" data-component="TabPagingContent">
        <div class="tabs" role="tablist" aria-label="포켓몬카드 커뮤니티" data-component="Tabs">
          <button id="tab-stories" role="tab" aria-selected="true" aria-controls="panel" tabindex="0" data-tab="stories">이야기</button>
          <button id="tab-products" role="tab" aria-selected="false" aria-controls="panel" tabindex="-1" data-tab="products">거래 상품</button>
        </div>
        <div id="panel" role="tabpanel" aria-labelledby="tab-stories" tabindex="0" data-component="SectionGroup"></div>
      </section>
    </div>
    <button class="write-fab" data-action="compose" aria-label="이야기 쓰기"><img src="assets/plus.svg" alt=""></button>
    <footer class="sample-note">공개 커뮤니티 사례를 재구성한 예시 대화예요. 거래·이용자·가격은 가상 데이터예요.</footer>
  </main>
  <button class="demo-button" data-action="demo">체험 설정</button>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
